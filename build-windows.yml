name: Build SoundShelf for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name SoundShelf --collect-all PySide6 main.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/SoundShelf/* -DestinationPath SoundShelf-Windows.zip
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SoundShelf-Windows
          path: SoundShelf-Windows.zip
          if-no-files-found: error
